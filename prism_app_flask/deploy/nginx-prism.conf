# nginx 리버스 프록시 템플릿 — gunicorn(:8600) 앞단.
# 목적: 표준 포트(80/443)·도메인·gzip·정적파일 캐시·(선택)TLS.
# 설치(관리자 권한): /etc/nginx/sites-available/ 에 두고 sites-enabled 로 symlink → nginx -t → reload.

upstream prism_flask {
    server 127.0.0.1:8600;
}

server {
    listen 80;
    server_name prism.example.org;   # ← 실제 도메인으로 교체

    # 정적파일은 nginx 가 직접 서빙(gunicorn 우회 → 빠름)
    location /static/ {
        alias /home/welcome1/sw1686/DIFFUSE/prism_app_flask/static/;
        expires 7d;
        access_log off;
    }

    location / {
        proxy_pass http://prism_flask;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    client_max_body_size 32m;   # score matrix 업로드 여유(향후)
}

# TLS 는 certbot 권장:  sudo certbot --nginx -d prism.example.org
